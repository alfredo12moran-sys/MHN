<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tablero de monitoreo y seguimiento – MHN Paraguay</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#17283a;--mut:#5d6b79;--line:#d9dfe5;--pri:#1f4e79;--ok:#2b7a63;--warn:#b7791f;--bad:#b3472f;--pre:#6b7c93;--inp:#f9fafb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a24;--card:#17232f;--ink:#e6ecf1;--mut:#93a3b3;--line:#2b3b4b;--pri:#6fa6d6;--ok:#5cbf9f;--warn:#e0aa4f;--bad:#e1856e;--pre:#8fa2b9;--inp:#1c2b39}}
:root[data-theme="dark"]{--bg:#101a24;--card:#17232f;--ink:#e6ecf1;--mut:#93a3b3;--line:#2b3b4b;--pri:#6fa6d6;--ok:#5cbf9f;--warn:#e0aa4f;--bad:#e1856e;--pre:#8fa2b9;--inp:#1c2b39}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 'IBM Plex Sans',Arial,sans-serif;min-height:100%}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
nav{background:var(--pri);padding:24px 12px;position:sticky;top:0;align-self:start;height:100vh;color:#fff}
nav h1{font-size:15px;font-weight:600;margin:0 8px 4px;line-height:1.3}nav p{font-size:12.5px;margin:0 8px 20px;opacity:.8}
nav button{display:block;width:100%;text-align:left;background:none;border:0;color:#fff;padding:9px 10px;border-radius:6px;font:inherit;cursor:pointer;opacity:.85}
nav button:hover{background:rgba(255,255,255,.12)}nav button.on{background:rgba(255,255,255,.2);opacity:1;font-weight:600}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) nav{background:#16293b}}
main{padding:28px 32px 48px;min-width:0}
header{display:flex;flex-wrap:wrap;gap:16px;align-items:end;justify-content:space-between;margin-bottom:20px}
header h2{margin:0;font-size:24px;font-weight:600}
.ctl{display:flex;gap:12px;flex-wrap:wrap}.ctl label{font-size:12.5px;color:var(--mut);display:flex;flex-direction:column;gap:3px}
input,select{font:inherit;color:var(--ink);background:var(--inp);border:1px solid var(--line);border-radius:5px;padding:6px 8px;width:100%;min-width:0}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:20px}
.k{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--pri);border-radius:6px;padding:14px 16px}
.k b{display:block;font-size:28px;font-weight:600;line-height:1.1}.k span{font-size:13px;color:var(--mut)}
.k.g{border-left-color:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:18px 20px;margin-bottom:16px}
.card h3{margin:0 0 4px;font-size:16px;font-weight:600}.card p.n{margin:0 0 12px;color:var(--mut);font-size:13.5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.w{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:760px}
th{font-size:12.5px;font-weight:600;text-align:left;color:var(--mut);padding:8px 6px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:4px 4px;border-bottom:1px solid var(--line);vertical-align:middle;min-width:110px}td:last-child{min-width:36px}
td input,td select{border-color:transparent;background:transparent}td input:hover,td select:hover{border-color:var(--line)}
.cv{display:block;padding:6px 8px;font-weight:600;white-space:nowrap}
select[data-v=Validada],select[data-v=Cumplido],select[data-v=Sí]{color:var(--ok);font-weight:600}
select[data-v=Reportada],select[data-v=En\ curso]{color:var(--warn);font-weight:600}
select[data-v=Preliminar]{color:var(--pre);font-weight:600}select[data-v=Vencido],select[data-v=Aislado]{color:var(--bad);font-weight:600}
button.add,button.x{font:inherit;cursor:pointer;border-radius:5px;border:1px solid var(--line);background:var(--card);color:var(--pri);padding:6px 12px;margin-top:10px}
button.x{margin:0;padding:2px 8px;color:var(--mut)}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--ok)}
.row{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.chips{display:flex;gap:10px;flex-wrap:wrap}.chip{border:1px solid var(--line);border-radius:5px;padding:8px 12px;font-size:14px}.chip b{font-size:20px;margin-right:6px}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px}dt{color:var(--mut)}dd{margin:0;font-weight:500}
.note{font-size:13px;color:var(--mut);margin:0 0 16px}
.intro{background:linear-gradient(135deg,var(--pri),#16354e);color:#fff;border-radius:10px;padding:22px 24px;margin-bottom:18px}
.intro h3{font-size:20px;margin:0 0 8px}.intro p{margin:0;max-width:900px;line-height:1.6;color:inherit}
.resource-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.resource{border:1px solid var(--line);border-radius:8px;background:var(--card);padding:17px}
.resource h3{margin:0 0 7px;font-size:16px}.resource p{font-size:14px;color:var(--mut);margin:0 0 14px}
.resource a{display:inline-block;color:var(--pri);font-weight:600;text-decoration:none;border:1px solid var(--line);border-radius:5px;padding:7px 10px}
.resource a:hover{text-decoration:underline}.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:11px;opacity:.8;margin-bottom:6px}
@media (max-width:820px){.app{display:block}nav{position:static;height:auto;display:flex;overflow-x:auto;padding:12px;gap:4px;padding-top:calc(12px + env(safe-area-inset-top,0px))}nav h1,nav p{display:none}nav button{width:auto;white-space:nowrap}main{padding:20px 14px 40px}.two{grid-template-columns:1fr}}
</style></head><body>
<div class="app"><nav id="nav"><h1>Sala de situación virtual</h1><p>Mesa Humanitaria Nacional · Paraguay</p></nav>
<main><header><h2 id="ttl"></h2><div class="ctl">
<label>Fecha y hora de corte<input type="datetime-local" id="cut"></label>
<label>Nivel de alerta<select id="lvl"><option>Vigilancia</option><option>Atención</option><option>Alerta</option><option>Activación</option></select></label></div></header>
<p class="note">Estructura de seguimiento sin cifras confirmadas: complete los campos. Las celdas se editan en pantalla y los indicadores se recalculan; los datos no se guardan al cerrar la página.</p>
<div id="view"></div></main></div>
<script>
const ST=['Preliminar','Reportada','Validada'],N=v=>+v||0,F=v=>N(v).toLocaleString('es-PY');
const dash=(v,f)=>v?f(v):'—';
const TB={
am:{title:'Tablero de amenaza (Anexo C)',cols:[['fuente','Fuente / estación','t'],['variable','Variable','t'],['valor','Valor / unidad','t'],['fecha','Fecha/hora de lectura','dt'],['tend','Tendencia','s',['—','Sube','Estable','Baja']],['umbral','Umbral / nivel','t'],['valid','Validación / enlace','t'],['resp','Acción / responsable','t']],
rows:[{fuente:'DMH / estación',variable:'Nivel hidrométrico'},{fuente:'DMH',variable:'Lluvia / aviso'},{fuente:'EBY / Itaipú',variable:'Nivel / caudal / operación'},{fuente:'SEN / municipios',variable:'Impactos y evacuaciones'},{fuente:'GEOlab / FAO',variable:'Capa o producto geoespacial'}]},
afe:{title:'Afectación y asistencia por distrito (Anexo A)',cols:[['dep','Depto. / distrito / comunidad','t'],['afe','Familias afectadas','n'],['eva','Familias evacuadas','n'],['asi','Familias asistidas por SEN','n'],['per','Personas asistidas','n'],['sin','Familias sin asistencia','c',r=>Math.max(0,N(r.afe)-N(r.asi))],['cob','Cobertura','c',r=>N(r.afe)?Math.round(100*N(r.asi)/N(r.afe))+' %':'—'],['est','Fuente / estado','s',ST]],rows:[{est:'Preliminar'},{est:'Preliminar'},{est:'Preliminar'}]},
nec:{title:'Necesidades, asistencia y brechas por tipo (Anexo A)',cols:[['tipo','Tipo de necesidad / asistencia','t'],['unid','Unidad','t'],['nec','Cantidad necesaria','n'],['ent','Cantidad entregada','n'],['pla','Cantidad planificada','n'],['bre','Brecha pendiente','c',r=>Math.max(0,N(r.nec)-N(r.ent)-N(r.pla))],['org','Organización potencial','t'],['cap','Capacidad confirmada','n'],['plz','Plazo / condiciones','t']],
rows:['Alimentos','Alojamiento / artículos no alimentarios','Agua, saneamiento e higiene','Salud / protección','Medios de vida / agricultura familiar','Logística / acceso'].map(t=>({tipo:t}))},
alb:{title:'Albergues y comunidades aisladas (Anexo B)',cols:[['dis','Distrito / comunidad','t'],['nom','Tipo y nombre del alojamiento','t'],['fam','Familias','n'],['per','Personas','n'],['cap','Capacidad total','n'],['disp','Capacidad disponible','n'],['ser','Servicios disponibles','t'],['res','Responsable','t'],['acc','Acceso','s',['Accesible','Aislado parcial','Aislado']],['bre','Brechas y acción','t']],rows:[{},{}]},
med:{title:'Medidas, planes de contingencia y capacidades (Anexo D)',cols:[['ins','Institución','t'],['plan','Plan o medida prevista','t'],['cond','Condición de activación','t'],['pob','Población destinataria','t'],['cob','Cobertura territorial','t'],['cap','Capacidad prevista (familias)','n'],['rec','Recursos y financiamiento','t'],['est','Estado','s',['Informado; pendiente de validación','Validado','En ejecución','Ejecutado']]],
rows:[{ins:'MDS',plan:'Hambre Cero: kits de alimentos frescos y no perecederos a familias de estudiantes de 1.º a 9.º grado',cond:'Suspensión de clases presenciales',pob:'Familias de estudiantes matriculados 1.º–9.º',cob:'Por confirmar',rec:'Por confirmar',est:'Informado; pendiente de validación'},{ins:'BNF',plan:'Refinanciamiento de productos crediticios de productores',cond:'Por confirmar',pob:'Productores con créditos que cumplan criterios',cob:'Por confirmar',rec:'Por confirmar',est:'Informado; pendiente de validación'}]},
w3:{title:'Matriz 3W: quién hace qué, dónde y para quién',cols:[['org','Organización','t'],['sec','Sector','t'],['ubi','Ubicación','t'],['act','Actividad','t'],['pob','Población objetivo','t'],['fase','Estado de la actividad','s',['Planificada','En curso','Ejecutada']],['fec','Actualizado','d'],['val','Validado por el sector','s',['No','Sí']]],rows:[{},{}]},
cos:{title:'Costos de la respuesta humanitaria (Anexo E)',cols:[['ins','Institución','t'],['act','Actividad','t'],['cant','Cantidad prevista','n'],['uni','Costo unitario (USD)','n'],['tot','Costo total previsto (USD)','c',r=>N(r.uni)?F(N(r.cant)*N(r.uni)):'Por calcular'],['fin','Financiamiento confirmado (USD)','n'],['fuen','Fuente de financiamiento','t'],['bre','Brecha financiera (USD)','c',r=>N(r.uni)?F(Math.max(0,N(r.cant)*N(r.uni)-N(r.fin))):'Por determinar'],['est','Estado','s',['Planificado','Financiado','En ejecución','Ejecutado','Pendiente de financiamiento']]],
rows:[{ins:'MDS',act:'Kits de alimentos frescos y no perecederos ante suspensión de clases (por familia)',cant:500000,fuen:'Gobierno Nacional',est:'Planificado'},{ins:'BNF',act:'Refinanciamiento de productos crediticios de productores',est:'Planificado'},{ins:'SEN / municipios',act:'Habilitación y operación de albergues',est:'Planificado'}]},
dec:{title:'Bitácora de acuerdos y decisiones',cols:[['fec','Fecha','d'],['acu','Acuerdo / decisión','t'],['ter','Territorio / sector','t'],['res','Responsable','t'],['plz','Plazo','d'],['est','Estado','s',['Pendiente','En curso','Cumplido','Vencido']],['falt','Información faltante / escalamiento','t']],rows:[{est:'Pendiente'},{est:'Pendiente'}]}
};
const V={res:['Resumen de situación'],ame:['Amenaza',['am']],afe:['Afectación, asistencia y brechas',['afe','nec']],alb:['Albergues',['alb']],resp:['Respuesta y capacidades',['med','w3']],cos:['Costos',['cos']],dec:['Decisiones',['dec']],mon:['Monitoreo integrado']};
const NAV=[['res','Resumen'],['ame','Amenaza'],['afe','Afectación y brechas'],['alb','Albergues'],['resp','Respuesta y capacidades'],['cos','Costos'],['dec','Decisiones'],['mon','Monitoreo integrado']];
const FR={Vigilancia:['Cada 15 días','Por acordar'],'Atención':['Semanal','Viernes 12:00'],Alerta:['Dos veces por semana','Viernes 12:00'],'Activación':['Dos veces por semana las dos primeras semanas; luego semanal','Lunes, miércoles y viernes']};
let cur='res';const $=s=>document.querySelector(s),sum=(id,k)=>TB[id].rows.reduce((a,r)=>a+N(r[k]),0);
const esc=s=>String(s??'').replace(/"/g,'&quot;');
function cell(id,i,c,r){const [k,,t,o]=c,a=`data-t="${id}" data-i="${i}" data-k="${k}"`,v=r[k]??'';
if(t==='c')return`<span class="cv" ${a} data-c="1">${o(r)}</span>`;
if(t==='s')return`<select ${a} data-v="${esc(v||o[0])}">${o.map(x=>`<option${x===(v||o[0])?' selected':''}>${x}</option>`).join('')}</select>`;
return`<input ${a} type="${t==='n'?'number':t==='dt'?'datetime-local':t==='d'?'date':'text'}" ${t==='n'?'min="0"':''} value="${esc(v)}" aria-label="${c[1]}">`}
function table(id){const T=TB[id];return`<section class="card"><h3>${T.title}</h3><div class="w"><table><thead><tr>${T.cols.map(c=>`<th>${c[1]}</th>`).join('')}<th></th></tr></thead><tbody>${T.rows.map((r,i)=>`<tr>${T.cols.map(c=>`<td>${cell(id,i,c,r)}</td>`).join('')}<td><button class="x" data-del="${id}" data-i="${i}" aria-label="Eliminar fila">×</button></td></tr>`).join('')}</tbody></table></div><button class="add" data-add="${id}">Agregar fila</button></section>`}
function resumen(){const af=sum('afe','afe'),ev=sum('afe','eva'),as=sum('afe','asi'),sn=TB.afe.rows.reduce((a,r)=>a+Math.max(0,N(r.afe)-N(r.asi)),0),per=sum('alb','per'),bf=TB.cos.rows.reduce((a,r)=>a+(N(r.uni)?Math.max(0,N(r.cant)*N(r.uni)-N(r.fin)):0),0),l=FR[$('#lvl').value];
const cnt=e=>TB.afe.rows.filter(r=>(r.est||'Preliminar')===e).length,br=TB.nec.rows.filter(r=>N(r.nec)>0);
return`<div class="kpis"><div class="k"><b>${dash(af,F)}</b><span>Familias afectadas</span></div><div class="k"><b>${dash(ev,F)}</b><span>Familias evacuadas</span></div><div class="k"><b>${dash(as,F)}</b><span>Familias asistidas por SEN</span></div><div class="k g"><b>${dash(sn,F)}</b><span>Familias sin asistencia</span></div><div class="k"><b>${dash(per,F)}</b><span>Personas en albergues</span></div><div class="k g"><b>${dash(bf,v=>'USD '+F(v))}</b><span>Brecha financiera</span></div></div>
<div class="two"><section class="card"><h3>Estado de validación de las cifras</h3><p class="n">Filas del tablero de afectación según estado.</p><div class="chips">${ST.map(e=>`<div class="chip"><b>${cnt(e)}</b>${e}</div>`).join('')}</div></section>
<section class="card"><h3>Calendario según nivel: ${$('#lvl').value}</h3><p class="n">Frecuencias de referencia del protocolo.</p><dl><dt>SITREP</dt><dd>${l[0]}</dd><dt>Boletín público</dt><dd>Quincenal</dd><dt>Corte de campo</dt><dd>${l[1]}</dd><dt>3W</dt><dd>Viernes 12:00; validación sectorial 17:00</dd></dl></section></div>
<section class="card"><h3>Brechas por tipo de asistencia</h3><p class="n">Cobertura = entregado + planificado frente a lo necesario.</p>${br.length?br.map(r=>{const c=Math.min(100,Math.round(100*(N(r.ent)+N(r.pla))/N(r.nec)));return`<div style="margin-bottom:12px"><div class="row"><span>${r.tipo}</span><span>Brecha ${F(Math.max(0,N(r.nec)-N(r.ent)-N(r.pla)))} · cubierto ${c} %</span></div><div class="bar"><i style="width:${c}%"></i></div></div>`}).join(''):'<p class="n">Registre cantidades necesarias en «Afectación, asistencia y brechas» para ver las brechas.</p>'}</section>
<section class="card"><h3>Regla de interpretación</h3><p class="n" style="margin:0">Exposición estimada no equivale a afectación confirmada; familias afectadas no equivale a familias asistidas; asistencia planificada no equivale a entregada. Cada dato lleva fuente, fecha de corte, cobertura, estado de validación y limitaciones.</p></section>`}
function monitoreo(){return `<div class="intro"><div class="eyebrow">Mesa Humanitaria Nacional · Paraguay</div><h3>Monitoreo integrado para anticipar riesgos</h3><p>Integrar información hidrológica, meteorológica y geoespacial permite reconocer zonas potencialmente expuestas a inundaciones y orientar la preparación, la priorización de necesidades y la coordinación de la respuesta humanitaria. Los datos deben interpretarse junto con su fecha de actualización, fuente y nivel de validación.</p></div>
<section class="card"><h3>Herramientas de referencia</h3><p class="n">Fuentes que pueden complementar el seguimiento territorial y el análisis de escenarios.</p><div class="resource-grid">
<div class="resource"><h3>Tablero de niveles de los ríos</h3><p>Consulta de lecturas recientes y registros históricos de estaciones hidrométricas para observar la evolución de los niveles y contextualizar posibles crecidas.</p><span class="cv">Uso: seguimiento hidrológico</span></div>
<div class="resource"><h3>Centro de Información sobre Fenómenos Meteorológicos Severos · OMM</h3><p>Consulta de avisos oficiales sobre fenómenos meteorológicos, hidrológicos y climáticos extremos o potencialmente de gran impacto.</p><a href="https://severeweather.wmo.int/index.html" target="_blank" rel="noopener noreferrer">Consultar avisos OMM ↗</a></div>
<div class="resource"><h3>GEOLab · Agencia Espacial del Paraguay</h3><p>Capacidades de observación de la Tierra y análisis geoespacial para elaborar información territorial que apoye el seguimiento de áreas potencialmente afectadas.</p><a href="https://geolabaep.github.io/" target="_blank" rel="noopener noreferrer">Visitar GEOLab ↗</a></div>
</div></section>
<section class="card"><h3>¿Cómo se utiliza la información?</h3><div class="two"><div><p><b>1. Monitorear</b><br><span class="n">Revisar avisos meteorológicos y lecturas hidrológicas disponibles.</span></p><p><b>2. Analizar</b><br><span class="n">Cruzar la información con mapas de exposición, población, servicios e infraestructura.</span></p></div><div><p><b>3. Priorizar</b><br><span class="n">Identificar territorios que requieren análisis y preparación prioritaria.</span></p><p><b>4. Coordinar</b><br><span class="n">Compartir hallazgos con las instituciones responsables para apoyar decisiones y acciones humanitarias.</span></p></div></div></section>
<p class="note">Importante: las herramientas aportan información para el análisis; por sí solas no confirman afectaciones ni constituyen necesariamente un pronóstico de El Niño o de inundaciones. Verifique la fecha, la cobertura y la fuente de cada dato.</p>`}
function render(){$('#ttl').textContent=V[cur][0];$('#view').innerHTML=cur==='res'?resumen():cur==='mon'?monitoreo():V[cur][1].map(table).join('');document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===cur))}
NAV.forEach(([k,l])=>{const b=document.createElement('button');b.textContent=l;b.dataset.v=k;b.onclick=()=>{cur=k;render()};$('#nav').append(b)});
document.addEventListener('input',e=>{const d=e.target.dataset;if(d.t&&d.k&&!d.c){const r=TB[d.t].rows[d.i];r[d.k]=e.target.type==='number'?e.target.value:e.target.value;if(e.target.tagName==='SELECT')e.target.dataset.v=e.target.value;
document.querySelectorAll('[data-c]').forEach(s=>{const c=TB[s.dataset.t].cols.find(c=>c[0]===s.dataset.k);s.textContent=c[3](TB[s.dataset.t].rows[s.dataset.i])})}});
document.addEventListener('click',e=>{const d=e.target.dataset;if(d.add){TB[d.add].rows.push({});render()}if(d.del){TB[d.del].rows.splice(d.i,1);render()}});
$('#lvl').onchange=render;$('#cut').value=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16);render();
</script></body></html>
